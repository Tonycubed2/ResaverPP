; ReSaverHelper - lets ReSaver++ (ReSaver Plus) act in the running game.
; ReSaver++ can change these settings itself while the game runs (Quests page / Settings).
[General]
; How the helper confirms what it did: hud = top-left notification, box = message box, none
sNotify=hud
; 1 = refresh the quest journal after every save load (brings back quests and objectives the
; journal stopped showing). 0 = only when you ask for it in ReSaver++.
bRefreshJournalOnLoad=0
; seconds to wait after a load before that refresh starts
iRefreshDelaySeconds=5
; 0 = do not accept commands from ReSaver++ at all
bListen=1
; Hold Ctrl in the game for iRescueHoldSeconds: the game is saved (a new save, ReSaverPP_Rescue_<date>),
; your controls are switched back on and every follower is brought next to you. 0 = off.
bRescueHotkey=1
; seconds Ctrl must be held (3 to 60)
iRescueHoldSeconds=8
; characters Gather followers leaves alone: form ids as the console shows them, separated by commas
sGatherSkip=

; Menu load guard (read when the game starts): when a menu's interface file (Interface\<name>.swf) does not load,
; the helper logs why, tries again, and if it still fails the menu does not open (with a notice) instead of
; crashing the game. 0 = off (no hooks at all).
bMenuLoadGuard=1
; how many more tries after a failed load (0 to 5; the second and later wait 50 ms)
iMenuLoadRetries=2
; 1 = one log line for every interface file loaded (else only failures, with the last 50 loads)
bLogAllMovieLoads=0
; 1 = Scaleform's own error messages and its file opening are written to the log when a load fails (version 17)
bMenuLoadDiagnostics=1
; Linux / Steam Deck (Proton) only: when another program is started into the game's Proton prefix, Proton removes the
; drive the game runs from (S:) and menus crash. 1 = the helper puts it back at once (version 18). 0 = off.
bFixProtonGameDrive=1
; TEST ONLY - leave empty. Interface file names whose load is made to fail on purpose (e.g. Map,Quest_Journal,
; StatsMenu - StatsMenu is the Skills menu, which loads its file in the background),
; to try the guard. sTestFailMode: first = only the first try fails (the retry works), all = every try fails.
sTestFailMovies=
sTestFailMode=first
