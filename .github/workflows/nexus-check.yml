name: Check Nexus changelogs

# Manual: shows (as annotations on the run page) the changelog entries Nexus has for the given versions.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions to show, space-separated"
        required: true
        default: "19.6"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: nexus
    steps:
      - name: Read changelogs
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          code=$(curl -sS -o cl.json -w '%{http_code}' -H "apikey: $KEY" -H "User-Agent: ReSaverPP-release" \
            "https://api.nexusmods.com/v1/games/skyrimspecialedition/mods/196293/changelogs.json")
          echo "::notice::HTTP $code, versions with entries: $(jq -r 'keys | join(", ")' cl.json 2>/dev/null | head -c 600)"
          for v in $VERSIONS; do
            echo "::notice::$v: $(jq -c --arg v "$v" '.[$v] // "NO ENTRY"' cl.json | head -c 900)"
          done
          code=$(curl -sS -o mod.json -w '%{http_code}' -H "apikey: $KEY" -H "User-Agent: ReSaverPP-release" \
            "https://api.nexusmods.com/v1/games/skyrimspecialedition/mods/196293.json")
          echo "::notice::mod version on Nexus: $(jq -r '.version' mod.json)"
