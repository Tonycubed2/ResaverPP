name: Add Nexus changelog

# Adds changelog text for one version on the Nexus mod page (Logs tab), without uploading a file.
# Actions tab -> "Add Nexus changelog" -> Run workflow. Nexus appends: running it twice adds the text twice.
#
# Uses, in the "nexus" environment:
#   secret   NEXUSMODS_API_KEY
#   variable NEXUSMODS_MOD_ID   - optional; "Unique Mod ID" from Files tab -> Advanced (default 7318624468677)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version the entry is for (must match the uploaded version, e.g. 12)"
        required: true
      changelog:
        description: "Changelog text (plain text; use ' | ' to separate lines)"
        required: true

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - name: Post changelog
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_ID: ${{ vars.NEXUSMODS_MOD_ID || '7318624468677' }}
          VERSION: ${{ inputs.version }}
          TEXT: ${{ inputs.changelog }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Secret NEXUSMODS_API_KEY is missing in the nexus environment"; exit 1; fi
          text=$(printf '%s\n' "$TEXT" | sed 's/ | /\n/g')
          body=$(jq -n --arg v "$VERSION" --arg c "$text" '{version: $v, changelog: $c}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" -H "User-Agent: ReSaverPP-release" \
            --data "$body" "https://api.nexusmods.com/v3/mods/$MOD_ID/changelogs")
          echo "HTTP $code"
          cat resp.json; echo
          if [ "$code" != "201" ]; then echo "::error::Nexus refused the changelog (HTTP $code): $(head -c 300 resp.json)"; exit 1; fi
