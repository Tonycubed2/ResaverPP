name: Nexus file IDs

# Manual: prints the IDs the upload needs (file group ID, unique mod ID) for a mod on any game.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Game domain (skyrim, skyrimspecialedition)"
        required: true
        default: "skyrim"
      mod:
        description: "Mod ID on that game"
        required: true
        default: "122557"

permissions:
  contents: read

jobs:
  ids:
    runs-on: ubuntu-24.04
    environment: nexus
    steps:
      - name: Look up
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          DOMAIN: ${{ inputs.domain }}
          MOD: ${{ inputs.mod }}
        run: |
          h=(-H "apikey: $KEY" -H "User-Agent: ReSaverPP-release")
          curl -sS "${h[@]}" "https://api.nexusmods.com/v1/games/$DOMAIN/mods/$MOD.json" -o mod.json
          echo "::notice::MOD uid $(jq -r '.uid' mod.json) game_id $(jq -r '.game_id' mod.json) version $(jq -r '.version' mod.json)"
          curl -sS "${h[@]}" "https://api.nexusmods.com/v1/games/$DOMAIN/mods/$MOD/files.json" -o files.json
          echo "::notice::MOD status $(jq -r '.status' mod.json) available $(jq -r '.available' mod.json); files listed: $(jq -r '.files | length' files.json) ($(jq -r '[.files[] | "\(.file_id) \(.category_name) \(.name) \(.version)"] | join("; ")' files.json))"
          # v3 lists the page's files even before the page is published (v1 lists none then)
          uid=$(jq -r '.uid' mod.json)
          code=$(curl -sS -o v3.json -w '%{http_code}' "${h[@]}" "https://api.nexusmods.com/v3/mods/$uid/files")
          echo "::notice::v3 files HTTP $code: $(jq -c '[(.data // .)[]? | {id, name, version, category: (.category // .file_category)}]' v3.json 2>/dev/null | head -c 900)"
          [ "$code" = 200 ] || echo "::notice::v3 reply: $(head -c 600 v3.json)"
          # current files only, newest first (GitHub shows at most 10 notices per step)
          for f in $(jq -r '[.files[] | select(.category_name != "OLD_VERSION" and .category_name != "ARCHIVED")] | sort_by(-.file_id) | .[].file_id' files.json); do
            curl -sS "${h[@]}" "https://api.nexusmods.com/v3/games/$DOMAIN/mod-file-versions/$f" -o fv.json
            echo "::notice::FILEVERSION $f -> $(jq -c '{group: .data.file.id, name: .data.name, version: .data.version, category: .data.category}' fv.json)"
          done
