name: List Nexus changelogs

# Read-only: shows the changelog entries Nexus has for the mod (as notices on the run page).
on:
  workflow_dispatch:
    inputs:
      mod_id:
        description: "Nexus Unique Mod ID"
        required: false
        default: "7318624468677"

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - name: List changelogs
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_ID: ${{ inputs.mod_id }}
        run: |
          code=$(curl -sS -o resp.json -w '%{http_code}' -H "apikey: $KEY" -H "User-Agent: ReSaverPP-release" \
            "https://api.nexusmods.com/v3/mods/$MOD_ID/changelogs")
          echo "::notice::HTTP $code $(head -c 900 resp.json | tr '\n' ' ')"
